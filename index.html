try{if(localStorage.getItem("seOn")==="0")seOn=0}catch(e){}
function setSe(v){
 seOn=v?1:0;
 try{localStorage.setItem("seOn",String(seOn))}catch(e){}
 if(seOn)snd("rl");
}
function snd(t,id){
 if(!seOn)return;
 try{
  if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();
  if(ac.state=="suspended")ac.resume();
  let now=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();
  o.connect(g);g.connect(ac.destination);
  if(t=="gun"){
   o.type=id==2?"sawtooth":(id==6||id>=8?"square":"triangle");
   let f1=id==2?240:(id==6?150:(id==0||id==7||id==10?620:
          (id==9?500:(id>=8?540:420))));
   let dur=id==2?0.22:(id==6?0.25:(id==10?0.05:0.08));
   o.frequency.setValueAtTime(f1,now);
   o.frequency.exponentialRampToValueAtTime(55,now+dur);
   g.gain.setValueAtTime(id==10?0.12:0.18,now);
   g.gain.exponentialRampToValueAtTime(0.01,now+dur);
   o.start(now);o.stop(now+dur);
  }else if(t=="boom"){
   o.type="sawtooth";
   o.frequency.setValueAtTime(110,now);
   o.frequency.exponentialRampToValueAtTime(28,now+0.4);
   g.gain.setValueAtTime(0.35,now);
   g.gain.exponentialRampToValueAtTime(0.01,now+0.4);
   o.start(now);o.stop(now+0.4);
  }else if(t=="kn"){
   o.type="sine";
   o.frequency.setValueAtTime(id?950:500,now);
   o.frequency.exponentialRampToValueAtTime(id?280:160,now+0.12);
   g.gain.setValueAtTime(0.2,now);
   g.gain.exponentialRampToValueAtTime(0.01,now+0.12);
   o.start(now);o.stop(now+0.12);
  }else if(t=="hs"){
   o.type="sine";
   o.frequency.setValueAtTime(1400,now);
   o.frequency.exponentialRampToValueAtTime(2200,now+0.18);
   g.gain.setValueAtTime(0.28,now);
   g.gain.exponentialRampToValueAtTime(0.01,now+0.18);
   o.start(now);o.stop(now+0.18);
  }else if(t=="rl"){
   o.type="square";
   o.frequency.setValueAtTime(520,now);
   o.frequency.setValueAtTime(780,now+0.06);
   g.gain.setValueAtTime(0.12,now);
   g.gain.exponentialRampToValueAtTime(0.01,now+0.13);
   o.start(now);o.stop(now+0.13);
  }else if(t=="ku"){
   o.type="triangle";
   o.frequency.setValueAtTime(600,now);
   o.frequency.exponentialRampToValueAtTime(1600,now+0.3);
   g.gain.setValueAtTime(0.22,now);
   g.gain.exponentialRampToValueAtTime(0.01,now+0.3);
   o.start(now);o.stop(now+0.3);
  }
 }catch(e){}
}

 c.style.width=(800*s)+"px";c.style.height=(520*s)+"px";

function saveImg(target,file){
 let r=new FileReader();
 r.onload=ev=>{
  let im=new Image();
  im.onload=()=>{
   target.img=im;
   try{
    let rt=Math.min(1,160/Math.max(im.width,im.height));
    let cv=document.createElement("canvas");
    cv.width=Math.round(im.width*rt);
    cv.height=Math.round(im.height*rt);
    cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);
    localStorage.setItem(target.key,cv.toDataURL("image/png"));
   }catch(err){}
  };
  im.src=ev.target.result;
 };
 r.readAsDataURL(file);
}
function autoMatch(files){
 let cnt=0;
 for(let f of files){
  if(!f.type.startsWith("image/"))continue;
  let nm=f.name.toLowerCase(),tg=null;
  if(nm.includes("金uzi")||nm.includes("golduzi")||nm.includes("gold_uzi"))tg=wps.at(7);
  else if(nm.includes("uzi"))tg=wps.at(0);
  else if(nm.includes("ak"))tg=wps.at(1);
  else if(nm.includes("デス")||nm.includes("death"))tg=wps.at(2);
  else if(nm.includes("アイス")||nm.includes("ice"))tg=wps.at(3);
  else if(nm.includes("毒")||nm.includes("poison")||nm.includes("snake"))tg=wps.at(4);
  else if(nm.includes("ピクセル")||nm.includes("pixel"))tg=wps.at(5);
  else if(nm.includes("ロケ")||nm.includes("rpg")||nm.includes("rocket"))tg=wps.at(6);
  else if(nm.includes("クリスタル")||nm.includes("crystal"))tg=cwCry;
  else if(nm.includes("ラッキー")||nm.includes("lucky"))tg=cwLck;
  else if(nm.includes("デジュアル")||nm.includes("クラスター")||
          nm.includes("cluster")||nm.includes("lack"))tg=cwLdc;
  else if(nm.includes("グリッチ")||nm.includes("glitch")||nm.includes("v15"))tg=knObjs.at(1);
  else if(nm.includes("ナイフ")||nm.includes("knife"))tg=knObjs.at(0);
  if(tg){saveImg(tg,f);cnt++}
 }
 if(cnt>0){toast=cnt+"個の武器画像を自動登録しました！";toastT=180;snd("ku")}
}
allImgs.forEach((w,i)=>{
 let o=document.createElement("option");o.value=i;o.text=w.n;sel.add(o);
 try{
  let sv=localStorage.getItem(w.key);
  if(sv){let im=new Image();im.onload=()=>{w.img=im};im.src=sv}
 }catch(e){}
});
inp.onchange=e=>{
 let f=e.target.files.item(0);
 if(f){
  saveImg(allImgs.at(sel.value),f);
  toast=allImgs.at(sel.value).n+" の画像を登録しました！";
  toastT=150;snd("rl");
 }
};
fld.onchange=e=>autoMatch(e.target.files);
c.ondragover=e=>e.preventDefault();
c.ondrop=e=>{e.preventDefault();autoMatch(e.dataTransfer.files)};
function knife(gx,gy,dir,sw,bsk,gl){
 x.save();x.translate(gx,gy);
 if(dir<0)x.scale(-1,1);if(sw>0)x.rotate(0.7);
 let ko=knObjs.at(gl?1:0);
 if(ko.img){
  let rt=(gl?56:44)/Math.max(ko.img.width,ko.img.height);
  let iw=ko.img.width*rt,ih=ko.img.height*rt;
  x.drawImage(ko.img,6,-ih/2,iw,ih);
 }else if(gl){
  x.fillStyle="#9333ea";x.fillRect(8,-4,11,8);
  x.fillStyle="#0ff";x.fillRect(18,-8,4,16);
  x.fillStyle="#22d3ee";x.beginPath();x.moveTo(22,-5);
  x.lineTo(46,0);x.lineTo(22,5);x.fill();
  x.fillStyle="#f0abfc";x.fillRect(25,-2,14,4);
 }else{
  x.fillStyle="#531";x.fillRect(10,-3,10,6);
  x.fillStyle="#ddd";x.beginPath();x.moveTo(20,-4);
  x.lineTo(38,0);x.lineTo(20,4);x.fill();
 }
 if(sw>0){
  x.strokeStyle=gl?"rgba(0,255,255,0.95)":
   (bsk?"rgba(255,40,40,0.95)":"rgba(255,255,255,0.8)");
  x.lineWidth=bsk||gl?5:3;x.beginPath();
  x.arc(12,0,25,-0.8,0.8);x.stroke();
 }
 x.restore();
}
function gun(w,gx,gy,dir,sc){
 let id=w.id,big=(id==1||id==2||id==5||id==6)?1.5:1;
 x.save();x.translate(gx,gy);
 if(dir<0)x.scale(-1,1);x.scale(sc*big,sc*big);
 if(w.img){
  let base=id==2?72:46;
  let rt=base/Math.max(w.img.width,w.img.height);
  let iw=w.img.width*rt,ih=w.img.height*rt;
  x.drawImage(w.img,-iw/2,-ih/2,iw,ih);
  x.restore();return;
 }
 if(id==0||id==7){
  x.fillStyle=id==7?"#fd0":"#3c3";
  x.fillRect(-10,-6,26,8);x.fillRect(-2,2,7,14);
  x.fillStyle="#222";x.fillRect(16,-4,6,4);
 }else if(id==1){
  x.fillStyle="#952";x.fillRect(-14,-4,12,8);
  x.fillStyle="#444";x.fillRect(-2,-5,22,7);
  x.fillStyle="#b63";x.fillRect(4,2,6,11);
 }else if(id==2){
  x.fillStyle="#812";x.fillRect(-22,-4,10,9);
  x.fillStyle="#d14";x.fillRect(-12,-6,30,11);
  x.fillStyle="#222";x.fillRect(18,-3,22,5);
  x.fillRect(38,-5,5,9);x.fillRect(-6,-12,18,5);
  x.fillStyle="#0ff";x.fillRect(-4,-11,3,3);x.fillRect(8,-11,3,3);
  x.fillStyle="#444";x.fillRect(2,5,7,10);
 }else if(id==3){
  x.fillStyle="#08f";x.fillRect(-12,-6,15,12);
  x.fillStyle="#f33";x.fillRect(3,-6,15,12);
  x.fillStyle="#fff";x.fillRect(18,-4,6,8);
 }else if(id==4){
  x.fillStyle="#0b4";x.fillRect(-12,-5,26,9);
  x.fillStyle="#0f8";x.fillRect(-6,-8,14,3);x.fillRect(14,-3,8,5);
 }else if(id==5){
  x.fillStyle="#f6b";x.fillRect(-12,-7,22,14);
  x.fillStyle="#fa0";x.fillRect(-8,-11,14,4);x.fillRect(10,-4,8,8);
 }else if(id==6){
  x.fillStyle="#564";x.fillRect(-16,-6,30,12);
  x.fillStyle="#d32";x.beginPath();x.moveTo(14,-8);
  x.lineTo(25,0);x.lineTo(14,8);x.fill();
 }else if(id==8){
  x.fillStyle="#426";x.fillRect(-14,-6,28,12);
  x.fillStyle="#c6f";x.fillRect(14,-8,10,16);x.fillRect(-4,-10,12,4);
 }else if(id==9){
  x.fillStyle="#0284c7";x.fillRect(-14,-6,28,12);
  x.fillStyle="#38bdf8";x.fillRect(-6,-10,14,4);x.fillRect(14,-4,9,8);
  x.fillStyle="#fff";x.fillRect(-2,-3,8,6);
 }else if(id==10){
  x.fillStyle="#b45309";x.fillRect(-11,-6,24,10);
  x.fillStyle="#fbbf24";x.fillRect(-3,4,7,12);x.fillRect(13,-4,7,6);
  x.fillStyle="#ef4444";x.fillRect(2,-9,8,3);
 }
 x.restore();
}

function lkText(p){
 let a=[];
 if(p.lk1)a.push("神速");
 if(p.lk2)a.push("拡散");
 if(p.lk3)a.push("青ビーム");
 return a.length?a.join(" / "):"能力なし";
}
function rollLk(p){
 if(p.w.id!=9)return;
 p.lk1=Math.random()<0.5?1:0;
 p.lk2=Math.random()<0.3?1:0;
 p.lk3=Math.random()<0.4?1:0;
 p.lkt=150;p.lkmsg="★ ["+lkText(p)+"]";
}
function mkP(px,py,d,cfg){
 let w=cfg.ob?cfg.b.w:cfg.w,w2=cfg.ob?cfg.b.w2:null;
 let pl={x:px,y:py,hp:100,dx:d,cd:0,mcd:65,rt:0,rt2:0,
  sl:0,ih:0,fr:0,ku:0,ps:0,sw:0,bk:0,bkmsg:"",hs:0,ds:0,dcd:0,gcd:0,
  w:w,am:w.am,w2:w2,am2:w2?w2.am:0,kn:0,gl:cfg.ob?cfg.b.gl:0,
  lk1:0,lk2:0,lk3:0,lkt:0,lkmsg:"",ait:0,aim:1,aix:0};
 rollLk(pl);return pl;
}
c.onclick=e=>{
 let pos=getPos(e),mx=pos.x,my=pos.y;
 if(st=="title"){
  if(mx>150&&mx<390&&my>295&&my<370){cpu=0;snd("rl");st="map"}
  else if(mx>410&&mx<650&&my>295&&my<370){cpu=1;snd("rl");st="diff"}
  else if(mx>280&&mx<520&&my>395&&my<455){snd("rl");st="set"}
 }else if(st=="diff"){
  if(mx>230&&mx<570&&my>140&&my<205){diff=0;snd("rl");st="map"}
  else if(mx>230&&mx<570&&my>225&&my<290){diff=1;snd("rl");st="map"}
  else if(mx>230&&mx<570&&my>310&&my<375){diff=2;snd("rl");st="map"}
  else if(mx>280&&mx<520&&my>410&&my<465){snd("rl");st="title"}
 }else if(st=="set"){
  if(mx>180&&mx<380&&my>220&&my<295)setSe(1);
  else if(mx>420&&mx<620&&my>220&&my<295)setSe(0);
  else if(mx>280&&mx<520&&my>375&&my<445){snd("rl");st="title"}
 }else if(st=="map"){
  snd("rl");
  maps.forEach((m,i)=>{
   let bx=110+(i%2)*310,by=130+Math.floor(i/2)*150;
   if(mx>bx&&mx<bx+270&&my>by&&my<by+110){
    sm=m;cur=0;tab=0;bcur=0;st="p1";
   }
  });
 }else if(st=="p1"||st=="p2"){
  snd("rl");
  if(mx>25&&mx<200&&my>58&&my<92)tab=0;
  if(mx>210&&mx<385&&my>58&&my<92)tab=1;
  if(tab==0)wps.forEach((w,i)=>{
   let bx=25+(i%2)*180,by=102+Math.floor(i/2)*96;
   if(mx>bx&&mx<bx+168&&my>by&&my<by+84)cur=i;
  });
  else bnds.forEach((b,i)=>{
   let by=102+i*96;
   if(mx>25&&mx<385&&my>by&&my<by+84)bcur=i;
  });
  if(mx>440&&mx<750&&my>410&&my<475){
   let pk=tab==0?{ob:0,w:wps.at(cur)}:{ob:1,b:bnds.at(bcur)};
   if(st=="p1"){wp1=pk;cur=0;tab=0;bcur=0;st="p2"}
   else{
    wp2=pk;ko=0;p1=mkP(80,260,1,wp1);p2=mkP(720,260,-1,wp2);
    bs=[];ex=[];bm=[];st="bat";
   }
  }
 }else if(st=="bat"){
  if(mx>685&&mx<788&&my>10&&my<40)setSe(!seOn);
 }else if(st=="res"){snd("rl");st="title"}
};
function hit(px,py,r){
 if(px-r<0||px+r>800||py-r<0||py+r>520)return 1;
 for(let w of sm.w){
  if(px+r>w.x&&px-r<w.x+w.w&&py+r>w.y&&py-r<w.y+w.h)return 1;
 }
}
function dmg(t,val,o,rs){
 t.hp=Math.max(0,Math.round((t.hp-val)*10)/10);
 if(t.hp<=0&&st=="bat"&&ko==0){
  ko=95;kx=t.x;ky=t.y;kmsg=rs||"";
  if(o==1){w1++;win="P1(赤) 勝利!"}
  else{w2++;win=(cpu?"CPU(青)":"P2(青)")+" 勝利!"}
 }
}
function boom(bx,by,o,md,rs){
 snd("boom");ex.push({x:bx,y:by,r:10,t:18});
 [[p1,2],[p2,1]].forEach(a=>{

   wantGacha=1;

 }
 if(p.kn==0&&p.am==0&&!p.rt)c.rl=1;
 if(p.kn==1&&p.w2&&p.am2==0&&!p.rt2)c.rl=1;
 let dodge=0;
 if(diff>0){
  let dRange=diff==1?210:260;
  for(let b of bs){
   if(b.o==2)continue;
   let bd=Math.hypot(b.x-p.x,b.y-p.y);

   }
  }
 }
 let want=210,aimTol=40,flank=0;
 if(p.kn==1&&!p.w2){want=22;aimTol=20;flank=(diff>0)}
 else if(p.kn==1&&p.w2){want=115;aimTol=42;flank=(diff>0)}
 else if(wid==0||wid==7){want=125;aimTol=44;flank=(diff>0)}
 else if(wid==1||wid==4){want=185;aimTol=38;flank=(diff==2&&Math.abs(dy)<35)}
 else if(wid==8){want=p.cd>15?210:110;aimTol=38;flank=(diff>0&&p.cd<=15)}
 else if(wid==2){want=360;aimTol=diff==2?14:20}
 else if(wid==3){want=(t.sl>0||p.ku>0)?135:215;aimTol=30;flank=(diff>0&&p.ku>0)}
 else if(wid==5){want=235;aimTol=38}
 else if(wid==6){want=280;aimTol=45}
 else if(wid==9){
  want=p.lk2?150:(p.lk3?340:230);
  aimTol=p.lk3?18:35;
  flank=(diff>0&&(p.lk1||p.lk2));
 }
 if(diff==0){want+=45;aimTol+=10}
 if(dist<140&&t.hp<45&&!p.w2&&diff>0)flank=1;
 let tx=flank?(t.x-t.dx*36):t.x;
 let ty=flank?(t.y+(p.y<t.y?-32:32)):t.y;

 if(!dodge){

   if(p.aim<0){if(!hit(p.x,p.y-22,16))c.u=1;else{p.aim=1;c.d=1}}
   else{if(!hit(p.x,p.y+22,16))c.d=1;else{p.aim=-1;c.u=1}}
   if(Math.abs(fdx)>40){

   }
  }else{
   if(fdist>want+20){if(fdx>0)c.r=1;else c.l=1}
   else if(fdist<want-25&&!flank){if(fdx>0)c.l=1;else c.r=1}
   else if(p.aix!=0){if(p.aix>0)c.r=1;else c.l=1}
   if(Math.abs(fdy)>10){if(fdy>0)c.d=1;else c.u=1}
   else if(wid!=2&&!p.lk3){if(p.aim>0)c.d=1;else c.u=1}
  }
 }
 p.dx=dx>0?1:-1;
 if(wantGacha&&p.am==p.w.am&&!p.rt){
  c.s=1;return c;
 }
 let gProb=diff==0?0.008:(diff==1?0.035:0.07);
 if(!blocked&&p.gcd<=0&&dist>140&&dist<350&&
    Math.abs(dy)<55&&Math.random()<gProb){
  p.kn=2;c.s=1;return c;
 }
 let canShoot=(!blocked||(wid==6&&dist<240));
 let sProb=diff==0?0.45:(diff==1?0.85:1.0);
 if(canShoot&&Math.abs(dy)<aimTol&&Math.random()<sProb)c.s=1;
 return c;
}
